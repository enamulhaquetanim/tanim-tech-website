backend:
  name: git-gateway
  branch: main

media_folder: "Image/gallery"
public_folder: "/Image/gallery"

collections:
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "content/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Alt text (for accessibility & SEO)", name: "alt", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["design", "events", "behind-the-scenes"]

  - name: "faq"
    label: "FAQ"
    files:
      - name: "faq"
        label: "Frequently Asked Questions"
        file: "content/faq.json"
        fields:
          - label: "Questions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
